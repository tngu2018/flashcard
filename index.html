<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Từ Vựng Tiếng Nhật</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #1B365D;
      margin-bottom: 8px;
      font-size: 24px;
      text-align: center;
    }

    .progress {
      color: #555;
      font-size: 14px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .flashcard-container {
      perspective: 1000px;
      width: 100%;
      max-width: 420px;
      height: 280px;
      margin-bottom: 20px;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: 16px;
      background-color: #ffffff;
      text-align: center;
    }

    .card-front {
      border: 2px solid #1B365D;
    }

    .word-front {
      font-size: 36px;
      font-weight: bold;
      color: #1B365D;
      margin-bottom: 12px;
    }

    .hint {
      font-size: 12px;
      color: #888;
      position: absolute;
      bottom: 15px;
    }

    .card-back {
      transform: rotateY(180deg);
      border: 2px solid #2e7d32;
      justify-content: space-between;
    }

    .reading {
      font-size: 18px;
      color: #2e7d32;
      font-weight: 600;
    }

    .meaning {
      font-size: 20px;
      font-weight: bold;
      color: #222;
      margin: 10px 0;
    }

    .example-box {
      background-color: #f8f9fa;
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      border-left: 3px solid #2e7d32;
    }

    .example {
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
    }

    .example-meaning {
      font-size: 13px;
      color: #666;
    }

    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 420px;
    }

    button {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background-color: #1B365D;
      color: white;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button.btn-secondary {
      background-color: #f39c12;
      flex: 0.8;
    }

    button.btn-secondary:hover {
      background-color: #d68910;
    }

    button:hover {
      background-color: #0f2341;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <h1>Học Từ Vựng Tiếng Nhật</h1>
  <div class="progress" id="progress">Đang tải...</div>

  <div class="flashcard-container">
    <div class="flashcard" id="card" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="word-front" id="word-front">---</div>
        <div class="hint">Chạm để xem nghĩa ➔</div>
      </div>
      <div class="card-face card-back">
        <div class="reading" id="word-reading">---</div>
        <div class="meaning" id="word-meaning">---</div>
        <div class="example-box">
          <div class="example" id="word-example">---</div>
          <div class="example-meaning" id="word-example-meaning">---</div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-prev" onclick="prevCard()" disabled>◄ Trước</button>
    <button class="btn-secondary" id="btn-shuffle" onclick="shuffleCards()">🔀 Trộn</button>
    <button id="btn-next" onclick="nextCard()">Tiếp ►</button>
  </div>

  <script>
    // Dữ liệu từ vựng tích hợp sẵn (Nâng cấp qua API đáng tin cậy)
    let flashcards = [];
    let currentIndex = 0;

    async function loadWords() {
      try {
        // Nguồn dữ liệu JLPT ổn định từ GitHub CDN
        const response = await fetch('https://raw.githubusercontent.com/freshed/jlpt-vocab/master/data/n5.json');
        if (!response.ok) throw new Error('Không thể tải');
        const data = await response.json();
        
        flashcards = data.map(item => ({
          front: item.word || item.kanji || item.kana,
          reading: item.kana || item.reading || '',
          meaning: item.meaning || item.english || '',
          example: item.example || '',
          example_meaning: item.example_meaning || ''
        }));
      } catch (error) {
        // Dữ liệu dự phòng mẫu offline nếu mạng lỗi
        flashcards = [
          { front: "愛", reading: "あい", meaning: "Tình yêu", example: "愛を込めて。", example_meaning: "Gửi gắm tình yêu thương." },
          { front: "挨拶", reading: "あいさつ", meaning: "Chào hỏi", example: "毎朝挨拶をします。", example_meaning: "Chào hỏi mỗi sáng." },
          { front: "青い", reading: "あおい", meaning: "Màu xanh da trời", example: "空が青いです。", example_meaning: "Bầu trời xanh." },
          { front: "赤い", reading: "あかい", meaning: "Màu đỏ", example: "赤いりんご。", example_meaning: "Quả táo đỏ." },
          { front: "秋", reading: "あき", meaning: "Mùa thu", example: "秋が好きです。", example_meaning: "Tôi thích mùa thu." },
          { front: "開ける", reading: "あける", meaning: "Mở (cửa)", example: "ドアを開けます。", example_meaning: "Mở cửa." },
          { front: "朝", reading: "あさ", meaning: "Buổi sáng", example: "朝6時に起きます。", example_meaning: "Thức dậy lúc 6 giờ sáng." },
          { front: "明日", reading: "あした", meaning: "Ngày mai", example: "明日会いましょう。", example_meaning: "Hẹn gặp lại vào ngày mai." },
          { front: "雨", reading: "あめ", meaning: "Cơn mưa", example: "雨が降っています。", example_meaning: "Trời đang mưa." },
          { front: "行く", reading: "いく", meaning: "Đi", example: "学校へ行きます。", example_meaning: "Đi đến trường." }
        ];
      }

      updateCard();
    }

    function updateCard() {
      const card = document.getElementById('card');
      card.classList.remove('flipped');

      setTimeout(() => {
        const item = flashcards[currentIndex];
        document.getElementById('word-front').innerText = item.front || '---';
        document.getElementById('word-reading').innerText = item.reading || '';
        document.getElementById('word-meaning').innerText = item.meaning || '';
        document.getElementById('word-example').innerText = item.example || '';
        document.getElementById('word-example-meaning').innerText = item.example_meaning || '';
        
        document.getElementById('progress').innerText = `${currentIndex + 1} / ${flashcards.length}`;
        
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === flashcards.length - 1;
      }, 150);
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function nextCard() {
      if (currentIndex < flashcards.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function shuffleCards() {
      for (let i = flashcards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
      }
      currentIndex = 0;
      updateCard();
    }

    loadWords();
  </script>
</body>
</html>
