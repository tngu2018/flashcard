<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Từ Vựng Tiếng Nhật (あ - わ)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #1B365D;
      margin-bottom: 8px;
      font-size: 24px;
      text-align: center;
    }

    .progress {
      color: #555;
      font-size: 14px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .flashcard-container {
      perspective: 1000px;
      width: 100%;
      max-width: 420px;
      height: 280px;
      margin-bottom: 20px;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: 16px;
      background-color: #ffffff;
      text-align: center;
    }

    .card-front {
      border: 2px solid #1B365D;
    }

    .word-front {
      font-size: 36px;
      font-weight: bold;
      color: #1B365D;
      margin-bottom: 12px;
    }

    .hint {
      font-size: 12px;
      color: #888;
      position: absolute;
      bottom: 15px;
    }

    .card-back {
      transform: rotateY(180deg);
      border: 2px solid #2e7d32;
      justify-content: space-between;
    }

    .reading {
      font-size: 18px;
      color: #2e7d32;
      font-weight: 600;
    }

    .meaning {
      font-size: 20px;
      font-weight: bold;
      color: #222;
      margin: 10px 0;
    }

    .example-box {
      background-color: #f8f9fa;
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      border-left: 3px solid #2e7d32;
    }

    .example {
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
    }

    .example-meaning {
      font-size: 13px;
      color: #666;
    }

    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 420px;
    }

    button {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background-color: #1B365D;
      color: white;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button.btn-secondary {
      background-color: #f39c12;
      flex: 0.8;
    }

    button.btn-secondary:hover {
      background-color: #d68910;
    }

    button:hover {
      background-color: #0f2341;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <h1>Học Từ Vựng Tiếng Nhật</h1>
  <div class="progress" id="progress">⏳ Đang tải dữ liệu từ vựng...</div>

  <div class="flashcard-container">
    <div class="flashcard" id="card" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="word-front" id="word-front">---</div>
        <div class="hint">Chạm để xem nghĩa ➔</div>
      </div>
      <div class="card-face card-back">
        <div class="reading" id="word-reading">---</div>
        <div class="meaning" id="word-meaning">---</div>
        <div class="example-box">
          <div class="example" id="word-example">---</div>
          <div class="example-meaning" id="word-example-meaning">---</div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-prev" onclick="prevCard()" disabled>◄ Trước</button>
    <button class="btn-secondary" id="btn-shuffle" onclick="shuffleCards()" disabled>🔀 Trộn</button>
    <button id="btn-next" onclick="nextCard()" disabled>Tiếp ►</button>
  </div>

  <script>
    let flashcards = [];
    let currentIndex = 0;

    // Tải dữ liệu từ vựng từ CDN GitHub công khai
    async function loadWords() {
      try {
        const response = await fetch('https://cdn.jsdelivr.net/gh/miku-dev/japanese-vocabulary-dataset@main/jlpt_all.json');
        
        if (!response.ok) {
          throw new Error('Không thể tải từ vựng online');
        }

        flashcards = await response.json();

        if (flashcards && flashcards.length > 0) {
          document.getElementById('btn-shuffle').disabled = false;
          updateCard();
        } else {
          document.getElementById('progress').innerText = "Không tìm thấy dữ liệu từ vựng!";
        }
      } catch (error) {
        console.error(error);
        document.getElementById('progress').innerText = "Lỗi kết nối khi tải dữ liệu online!";
      }
    }

    function updateCard() {
      const card = document.getElementById('card');
      card.classList.remove('flipped');

      setTimeout(() => {
        const item = flashcards[currentIndex];
        document.getElementById('word-front').innerText = item.front || item.kanji || item.word || '---';
        document.getElementById('word-reading').innerText = item.reading || item.kana || '';
        document.getElementById('word-meaning').innerText = item.meaning || item.vietnamese || '';
        document.getElementById('word-example').innerText = item.example || '';
        document.getElementById('word-example-meaning').innerText = item.example_meaning || '';
        
        document.getElementById('progress').innerText = `${currentIndex + 1} / ${flashcards.length}`;
        
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === flashcards.length - 1;
      }, 150);
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function nextCard() {
      if (currentIndex < flashcards.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function shuffleCards() {
      for (let i = flashcards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
      }
      currentIndex = 0;
      updateCard();
    }

    // Khởi chạy
    loadWords();
  </script>
</body>
</html>
