<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Động Từ Tiếng Nhật (Chữ あ) - Flashcards</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }
        .flashcard-container {
            width: 100%;
            max-width: 450px;
            height: 340px;
            perspective: 1000px;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            background: #ffffff;
        }
        .card-front {
            border: 2px solid #4a90e2;
        }
        .card-front .kanji {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .card-front .reading {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .card-back {
            transform: rotateY(180deg);
            background: #fdfdfd;
            border: 2px solid #2ecc71;
            justify-content: space-around;
        }
        .meaning {
            font-size: 1.3rem;
            font-weight: bold;
            color: #27ae60;
        }
        .example-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            border-left: 4px solid #2ecc71;
            text-align: left;
            position: relative;
        }
        .example-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .example-jp {
            font-weight: bold;
            color: #34495e;
            font-size: 0.95rem;
            padding-right: 10px;
        }
        .example-reading {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        .example-vi {
            font-size: 0.9rem;
            color: #555;
        }
        
        /* Speaker Buttons Style */
        .btn-audio {
            background: #eef5fc;
            color: #4a90e2;
            border: 1px solid #4a90e2;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-audio:hover {
            background: #4a90e2;
            color: #ffffff;
            transform: scale(1.08);
        }
        .btn-audio-sm {
            width: 32px;
            height: 32px;
            font-size: 0.9rem;
            background: #eafaf1;
            color: #2ecc71;
            border: 1px solid #2ecc71;
            flex-shrink: 0;
        }
        .btn-audio-sm:hover {
            background: #2ecc71;
            color: #ffffff;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn-nav {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-nav:hover {
            background-color: #357abd;
        }
        .counter {
            font-size: 1rem;
            font-weight: bold;
            color: #555;
        }
        .hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Flashcard 100 Động Từ Tiếng Nhật (あ)</h1>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="card" id="card">
            <!-- Mặt trước -->
            <div class="card-face card-front">
                <div class="kanji" id="kanji">---</div>
                <div class="reading" id="reading">---</div>
                <button class="btn-audio" onclick="speakWord(event)" title="Phát âm từ vựng">🔊</button>
            </div>
            <!-- Mặt sau -->
            <div class="card-face card-back">
                <div class="meaning" id="meaning">---</div>
                <div class="example-box">
                    <div class="example-header">
                        <div class="example-jp" id="ex-jp">---</div>
                        <button class="btn-audio btn-audio-sm" onclick="speakExample(event)" title="Đọc câu ví dụ">🔊</button>
                    </div>
                    <div class="example-reading" id="ex-read">---</div>
                    <div class="example-vi" id="ex-vi">---</div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-nav" onclick="prevCard(event)">❮ Trước</button>
        <span class="counter" id="counter">1 / 100</span>
        <button class="btn-nav" onclick="nextCard(event)">Sau ❯</button>
    </div>

    <div class="hint">Chạm/Click vào thẻ để lật xem mặt sau</div>

    <script>
        const verbs = [

            { k: "ああなる", r: "ああなる", m: "Trở nên như thế, thành ra như thế", ej: "準備不足だから、ああなるのは当たり前だ。", er: "じゅんびぶそく だから、ああなる の は あたりまえ だ。", ev: "Vì chuẩn bị không kỹ nên thành ra như thế là lẽ tự nhiên." },

            { k: "相済む", r: "あいすむ", m: "Xong xuôi, dàn xếp ổn thỏa", ej: "それであい済む問題ではない。", er: "それ で あいすむ もんだい で は ない。", ev: "Đó không phải là vấn đề có thể dàn xếp xong như vậy." },
            { k: "愛する", r: "あいする", m: "Yêu, yêu thương", ej: "家族を深く愛している。", er: "かぞく を ふかく あいしている。", ev: "Tôi yêu gia đình sâu sắc." },

            { k: "相乱れる", r: "あいみだれる", m: "Hỗn loạn cùng nhau", ej: "髪が相乱れる。", er: "かみ が あいみだれる。", ev: "Tóc tai rối bời hỗn loạn." },

            { k: "アウトプットする", r: "あうとぷっとする", m: "Bộc lộ, đưa ra kiến thức", ej: "学んだことをアウトプットする。", er: "まな broad こと を あうとぷっと する。", ev: "Bộc lộ/ứng dụng kiến thức đã học." },
            { k: "和える", r: "あえる", m: "Trộn, bóp xốt (món ăn)", ej: "野菜をごまで和える。", er: "やさい を ごま で あえる。", ev: "Trộn rau củ với sốt mè." },
            { k: "仰ぎ見る", r: "あおぎみる", m: "Ngước nhìn lên, tôn kính", ej: "夜空の星を仰ぎ見る。", er: "よぞら の ほし を あおぎみる。", ev: "Ngước nhìn ngôi sao trên bầu trời đêm." },

            { k: "青ざめる", r: "あおざめる", m: "Tái xanh mặt (vì sợ/bệnh)", ej: "驚きのあまり顔が青ざめる。", er: "おどろき の あまり かお が あおざめる。", ev: "Mặt tái xanh vì quá kinh ngạc." },
            { k: "青ずむ", r: "あおずむ", m: "Trở nên xanh xao, ngả xanh", ej: "空が青ずんできた。", er: "そら が あおずんできた。", ev: "Bầu trời bắt đầu ngả xanh." },
            { k: "青田買いする", r: "あおたがいする", m: "Tuyển dụng sinh viên sớm", ej: "企業が人材を青田買いする。", er: "きぎょう が じんざい を あおたがい する。", ev: "Doanh nghiệp tuyển dụng sớm các tài năng." },
            { k: "あお向く", r: "あおむく", m: "Ngửa mặt lên", ej: "あお向いて空を見上げる。", er: "あおむいて そら を みあげる。", ev: "Ngửa mặt lên nhìn trời." },

            { k: "明かす", r: "あかす", m: "Tiết lộ (bí mật), thức suốt đêm", ej: "秘密を明かす。", er: "ひみつ を あかす。", ev: "Tiết lộ bí mật." },
            { k: "あがなう", r: "あがなう", m: "Chuộc lỗi, đền bù", ej: "罪をあがなう。", er: "つみ を あがなう。", ev: "Chuộc lại lỗi lầm." },
            { k: "あか抜ける", r: "あかぬける", m: "Trở nên sành điệu, lột xác", ej: "すっかりあか抜けた印象になる。", er: "すっかり あかぬけた いんしょう に なる。", ev: "Trở nên vô cùng sành điệu và cuốn hút." },
            { k: "上がる / 揚がる / 挙がる", r: "あがる", m: "Tăng lên / Treo lên / Nêu lên", ej: "物価が上がる。", er: "ぶっか が あがる。", ev: "Giá cả hàng hóa tăng lên." },
            { k: "諦める", r: "あきらめる", m: "Từ bỏ, bỏ cuộc", ej: "夢を諦めない。", er: "ゆめ を あきらめない。", ev: "Không từ bỏ ước mơ." },
            { k: "飽きる", r: "あきる", m: "Chán, ngấy", ej: "同じ味に飽きる。", er: "おなじ あじ に あきる。", ev: "Chán ngấy cùng một hương vị." },
            { k: "あきれる", r: "あきれる", m: "Sốc, cạn lời", ej: "彼の態度にあきれる。", er: "かれ の たいど に あきれる。", ev: "Cạn lời trước thái độ của anh ta." },
            { k: "開く / 空く / 明く", r: "あく", m: "Mở / Trống / Bắt đầu", ej: "ドアが開く。", er: "どあ が あく。", ev: "Cánh cửa mở ra." },
            { k: "握手する", r: "あくしゅする", m: "Bắt tay", ej: "ガッチリと握手する。", er: "がっちり と あくしゅ する。", ev: "Bắt tay thật chặt." },
            { k: "アクセスする", r: "あくせすする", m: "Truy cập (website)", ej: "サイトにアクセスする。", er: "さいと に あくせす する。", ev: "Truy cập vào trang web." },
            { k: "悪戦苦闘する", r: "あくせんくとうする", m: "Vật lộn, chiến đấu gian khổ", ej: "難問に悪戦苦闘する。", er: "なんもん に あくせんくとう する。", ev: "Vật lộn với bài toán khó." },
            { k: "あくびする", r: "あくびする", m: "Ngáp", ej: "退屈であくびする。", er: "たいくつ で あくび する。", ev: "Vì nhàm chán nên ngáp." },
            { k: "悪用する", r: "あくようする", m: "Lợi dụng, dùng sai mục đích", ej: "立場を悪用する。", er: "たちば を あくよう する。", ev: "Lợi dụng vị trí/chức vụ." },
            { k: "あげつらう", r: "あげつらう", m: "Bắt bẻ, bới lông tìm vết", ej: "人の欠点をあげつらう。", er: "ひと の けってん を あげつらう。", ev: "Bới lông tìm vết khuyết điểm người khác." },
            { k: "開ける / 空ける / 揚げる / 上げる", r: "あける / あげる", m: "Mở / Làm trống / Chiên / Nâng lên", ej: "窓を開ける。", er: "まど を あける。", ev: "Mở cửa sổ." },
            { k: "憧れる", r: "あこがれる", m: "Ngưỡng mộ, mơ ước", ej: "日本での生活に憧れる。", er: "にほん で の せいかつ に あこがれる。", ev: "Mơ ước cuộc sống tại Nhật Bản." },
            { k: "あざける", r: "あざける", m: "Nhạo báng, chế giễu", ej: "失敗をあざける。", er: "しっぱい を あざける。", ev: "Chế giễu thất bại của người khác." },
            { k: "欺く", r: "あざむく", m: "Lừa dối, lừa lọc", ej: "敵を欺く。", er: "てき を あざむく。", ev: "Lừa dối kẻ địch." },
            { k: "アシストする", r: "あしすとする", m: "Hỗ trợ, kiến tạo", ej: "ゴールをアシストする。", er: "ごーる を あしすと する。", ev: "Kiến tạo bàn thắng." },
            { k: "味わう", r: "あじわう", m: "Thưởng thức, nếm trải", ej: "料理をじっくり味わう。", er: "りょうり を じっくり あじわう。", ev: "Thưởng thức kỹ món ăn." },
            { k: "預ける", r: "あずける", m: "Gửi, giao ủy thác", ej: "荷物をロッカーに預ける。", er: "にもつ を ろっかー に あずける。", ev: "Gửi hành lý vào tủ đồ." },
            { k: "焦る", r: "あせる", m: "Sốt ruột, nôn nóng", ej: "時間を気にして焦る。", er: "じかん を き に して あせる。", ev: "Sốt ruột vì để ý thời gian." },
            { k: "遊ぶ", r: "あそぶ", m: "Chơi, giải trí", ej: "公園で子供と遊ぶ。", er: "こうえん で こども と あそぶ。", ev: "Chơi với con ở công viên." },
            { k: "与える", r: "あたえる", m: "Ban cho, gây ra", ej: "影響を与える。", er: "えいきょう を あたえる。", ev: "Gây ra ảnh hưởng/tác động." },
            { k: "温める / 暖める", r: "あたためる", m: "Làm ấm, hâm nóng", ej: "スープを温める。", er: "すーぷ を あたためる。", ev: "Hâm nóng tô súp." },
            { k: "当たる", r: "あたる", m: "Trúng, đúng, va chạm", ej: "宝くじが当たる。", er: "たからくじ が あたる。", ev: "Trúng vé số." },
            { k: "扱う", r: "あつかう", m: "Xử lý, thao tác, đối xử", ej: "丁寧に取り扱う。", er: "ていねい に とりあつかう。", ev: "Thao tác/xử lý cẩn thận." },
            { k: "悪化する", r: "あっかする", m: "Trở nên tồi tệ, xấu đi", ej: "容態が悪化する。", er: "ようだい が あっか する。", ev: "Tình trạng sức khỏe xấu đi." },
            { k: "圧縮する", r: "あっしゅくする", m: "Nén (file, không khí)", ej: "ファイルを圧縮する。", er: "ふぁいる を あっしゅく する。", ev: "Nén tệp tin." },
            { k: "圧倒する", r: "あっとうする", m: "Áp đảo hoàn toàn", ej: "相手を圧倒する。", er: "あいて を あっとう する。", ev: "Áp đảo đối thủ." }
        ];

        let currentIndex = 0;
        const card = document.getElementById('card');

        function updateCard() {
            card.classList.remove('flipped');
            setTimeout(() => {
                const item = verbs[currentIndex];
                document.getElementById('kanji').innerText = item.k;
                document.getElementById('reading').innerText = item.r;
                document.getElementById('meaning').innerText = item.m;
                document.getElementById('ex-jp').innerText = item.ej;
                document.getElementById('ex-read').innerText = item.er;
                document.getElementById('ex-vi').innerText = item.ev;
                document.getElementById('counter').innerText = `${currentIndex + 1} / ${verbs.length}`;
            }, 150);
        }

        function flipCard() {
            card.classList.toggle('flipped');
        }

        function nextCard(event) {
            event.stopPropagation();
            if (currentIndex < verbs.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard(event) {
            event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // Hàm phát âm tiếng Nhật
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Dừng câu đang đọc nếu có
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9; // Tốc độ đọc vừa phải
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt của bạn không hỗ trợ tính năng phát âm.");
            }
        }

        function speakWord(event) {
            event.stopPropagation(); // Không cho lật thẻ khi bấm nút loa
            const item = verbs[currentIndex];
            speakText(item.r); // Đọc theo hiragana để đạt chuẩn âm
        }

        function speakExample(event) {
            event.stopPropagation(); // Không cho lật thẻ khi bấm nút loa
            const item = verbs[currentIndex];
            speakText(item.ej);
        }

        // Khởi tạo thẻ đầu tiên
        updateCard();
    </script>
</body>
</html>
