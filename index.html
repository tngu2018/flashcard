<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Động Từ Tiếng Nhật (Chữ あ) - Flashcards</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }
        .flashcard-container {
            width: 100%;
            max-width: 450px;
            height: 360px;
            perspective: 1000px;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            background: #ffffff;
        }
        .card-front {
            border: 2px solid #4a90e2;
        }
        .card-front .kanji {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .card-front .reading {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        
        /* Hiển thị Trọng âm (Pitch Accent) */
        .pitch-display {
            font-size: 1.4rem;
            color: #2c3e50;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 12px;
            background: #eef5fc;
            padding: 4px 12px;
            border-radius: 6px;
        }
        .pitch-high {
            text-decoration: overline;
            text-decoration-thickness: 2px;
            color: #e74c3c;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fdfdfd;
            border: 2px solid #2ecc71;
            justify-content: space-around;
        }
        .meaning {
            font-size: 1.3rem;
            font-weight: bold;
            color: #27ae60;
        }
        .example-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            border-left: 4px solid #2ecc71;
            text-align: left;
        }
        .example-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .example-jp {
            font-weight: bold;
            color: #34495e;
            font-size: 0.95rem;
            padding-right: 10px;
        }
        .example-reading {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        .example-vi {
            font-size: 0.9rem;
            color: #555;
        }
        
        /* Buttons Style */
        .btn-audio {
            background: #eef5fc;
            color: #4a90e2;
            border: 1px solid #4a90e2;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-audio:hover {
            background: #4a90e2;
            color: #ffffff;
            transform: scale(1.08);
        }
        .btn-audio-sm {
            width: 32px;
            height: 32px;
            font-size: 0.9rem;
            background: #eafaf1;
            color: #2ecc71;
            border: 1px solid #2ecc71;
            flex-shrink: 0;
        }
        .btn-audio-sm:hover {
            background: #2ecc71;
            color: #ffffff;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn-nav {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-nav:hover {
            background-color: #357abd;
        }
        .counter {
            font-size: 1rem;
            font-weight: bold;
            color: #555;
        }
        .pitch-legend {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #666;
            background: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .pitch-legend .pitch-high {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Flashcard 100 Động Từ Tiếng Nhật (あ)</h1>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="card" id="card">
            <!-- Mặt trước -->
            <div class="card-face card-front">
                <div class="kanji" id="kanji">---</div>
                <div class="reading" id="reading">---</div>
                <!-- Ký hiệu Trọng âm -->
                <div class="pitch-display" id="pitch">---</div>
                <button class="btn-audio" onclick="speakWord(event)" title="Phát âm từ vựng">🔊</button>
            </div>
            <!-- Mặt sau -->
            <div class="card-face card-back">
                <div class="meaning" id="meaning">---</div>
                <div class="example-box">
                    <div class="example-header">
                        <div class="example-jp" id="ex-jp">---</div>
                        <button class="btn-audio btn-audio-sm" onclick="speakExample(event)" title="Đọc câu ví dụ">🔊</button>
                    </div>
                    <div class="example-reading" id="ex-read">---</div>
                    <div class="example-vi" id="ex-vi">---</div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-nav" onclick="prevCard(event)">❮ Trước</button>
        <span class="counter" id="counter">1 / 100</span>
        <button class="btn-nav" onclick="nextCard(event)">Sau ❯</button>
    </div>

    <div class="pitch-legend">
        💡 Trọng âm: Chữ có <span class="pitch-high">gạch trên</span> đọc <strong>Giọng Cao</strong>, còn lại đọc <strong>Giọng Thấp</strong>.
    </div>

    <script>
        // pitch: mảng các phần tử HTML đánh dấu âm cao (H) hoặc thấp (L)
        const verbs = [
            { k: "ああ言う", r: "ああいう", pitch: "あ<span class='pitch-high'>あいう</span>", m: "Nói như thế, nói như vậy", ej: "ああ言う言い方は失礼だと思う。", er: "ああいう いいかた は しつれい だ と おもう。", ev: "Tôi nghĩ cách nói như thế là thất lễ." },
            { k: "ああなる", r: "ああなる", pitch: "あ<span class='pitch-high'>あな</span>る", m: "Trở nên như thế, thành ra như thế", ej: "準備不足だから、ああなるのは当たり前だ。", er: "じゅんびぶそく だから、ああなる の は あたりまえ だ。", ev: "Vì chuẩn bị không kỹ nên thành ra như thế là lẽ tự nhiên." },
            { k: "相争う", r: "あいあらそう", pitch: "あ<span class='pitch-high'>いあらそ</span>う", m: "Tranh giành nhau, tranh chấp lẫn nhau", ej: "二人の巨頭が相争う。", er: "ふたり の きょとう が あいあらそう。", ev: "Hai vị cựu lãnh đạo tranh giành lẫn nhau." },
            { k: "愛飲する", r: "あいいんする", pitch: "あ<span class='pitch-high'>いいんする</span>", m: "Thích uống, thường xuyên uống", ej: "父は毎朝緑茶を愛飲している。", er: "ちち は まいあさ りょくちゃ を あいいん している。", ev: "Bố tôi mỗi sáng đều thích uống trà xanh." },
            { k: "相打つ", r: "あいうつ", pitch: "あ<span class='pitch-high'>いう</span>つ", m: "Đánh trả lẫn nhau, hòa nhau", ej: "両者が相打つ形となった。", er: "りょうしゃ が あいうつ かたち と なった。", ev: "Cả hai bên rơi vào thế đánh ngang ngửa hòa nhau." },
            { k: "愛玩する", r: "あいがんする", pitch: "あ<span class='pitch-high'>いがんする</span>", m: "Yêu thương, cưng chiều", ej: "小鳥を愛玩する。", er: "ことり を あいがん する。", ev: "Cưng chiều chú chim nhỏ." },
            { k: "哀願する", r: "あいがんする", pitch: "あ<span class='pitch-high'>いがんする</span>", m: "Van xin, khẩn cầu", ej: "許してくれと哀願する。", er: "ゆるして くれ と あいがん する。", ev: "Van xin hãy tha lỗi cho tôi." },
            { k: "相競う", r: "あいきそう", pitch: "あ<span class='pitch-high'>いきそ</span>う", m: "Cạnh tranh lẫn nhau, thi đua", ej: "ライバル同士が相競う。", er: "らいばる どうし が あいきそう。", ev: "Các đối thủ cạnh tranh gay gắt với nhau." },
            { k: "愛好する", r: "あいこうする", pitch: "あ<span class='pitch-high'>いこうする</span>", m: "Yêu thích, hâm mộ", ej: "クラシック音楽を愛好する。", er: "くらっしく おんがく を あいこう する。", ev: "Yêu thích nhạc cổ điển." },
            { k: "愛顧する", r: "あいこする", pitch: "<span class='pitch-high'>あ</span>いこする", m: "Ủng hộ, chiếu cố", ej: "長年愛顧していただいたお客様。", er: "ながねん あいこ して いただいた おきゃくさま。", ev: "Những khách hàng đã ủng hộ trong nhiều năm." },
            { k: "愛護する", r: "あいごする", pitch: "<span class='pitch-high'>あ</span>いごする", m: "Bảo vệ, yêu thương (động vật)", ej: "動物を愛護する活動に参加する。", er: "どうぶつ を あいご する かつどう に さんか する。", ev: "Tham gia hoạt động bảo vệ động vật." },
            { k: "相異なる", r: "あいことなる", pitch: "あ<span class='pitch-high'>いことな</span>る", m: "Khác biệt nhau, trái ngược nhau", ej: "二人の意見は相異なる。", er: "ふたり の いけん は あいことなる。", ev: "Ý kiến của hai người hoàn toàn khác nhau." },
            { k: "挨拶する", r: "あいさつする", pitch: "<span class='pitch-high'>あ</span>いさつする", m: "Chào hỏi", ej: "毎朝近所の人に挨拶する。", er: "まいあさ きんじょ の ひと に あいさつ する。", ev: "Mỗi sáng tôi đều chào hỏi người hàng xóm." },
            { k: "愛し合う", r: "あいしあう", pitch: "あ<span class='pitch-high'>いしあ</span>う", m: "Yêu thương nhau", ej: "二人は深く愛し合っている。", er: "ふたり は ふかく あいしあっている。", ev: "Hai người yêu thương nhau sâu sắc." },
            { k: "合図する", r: "あいずする", pitch: "<span class='pitch-high'>あ</span>いずする", m: "Ra hiệu, ra tín hiệu", ej: "手を振って合図する。", er: "て を ふって あいず する。", ev: "Vẫy tay để ra hiệu." },
            { k: "愛する", r: "あいする", pitch: "<span class='pitch-high'>あ</span>いする", m: "Yêu, yêu thương", ej: "家族を深く愛している。", er: "かぞく を ふかく あいしている。", ev: "Tôi yêu gia đình sâu sắc." },
            { k: "相席する", r: "あいせきする", pitch: "あ<span class='pitch-high'>いせきする</span>", m: "Ngồi chung bàn (ở quán)", ej: "混雑しているので相席する。", er: "こんざつ しているので あいせき する。", ev: "Vì quán đông nên ngồi chung bàn." },
            { k: "相次ぐ", r: "あいつぐ", pitch: "あ<span class='pitch-high'>いつ</span>ぐ", m: "Xảy ra liên tiếp, dồn dập", ej: "事故が相次いで発生した。", er: "じこ が あいついで はっせい した。", ev: "Các vụ tai nạn xảy ra liên tiếp." },
            { k: "愛読する", r: "あいどくする", pitch: "あ<span class='pitch-high'>いどくする</span>", m: "Thích đọc (sách, báo)", ej: "この雑誌を愛読している。", er: "この ざっし を あいどく している。", ev: "Tôi rất thích đọc tạp chí này." },
            { k: "相乗りする", r: "あいのりする", pitch: "あ<span class='pitch-high'>いのりする</span>", m: "Đi chung xe", ej: "タクシーに相乗りする。", er: "たくしー に あいのり する。", ev: "Đi chung xe taxi." },
            { k: "相反する", r: "あいはんする", pitch: "あ<span class='pitch-high'>いはんする</span>", m: "Mâu thuẫn, trái ngược nhau", ej: "相反する意見が対立する。", er: "あいはん する いけん が たいりつ する。", ev: "Các ý kiến trái ngược nhau tranh luận gay gắt." },
            { k: "愛用する", r: "あいようする", pitch: "あ<span class='pitch-high'>いようする</span>", m: "Thường xuyên sử dụng", ej: "この万年筆を愛用している。", er: "この まんねんひつ を あいよう している。", ev: "Tôi thường xuyên dùng chiếc bút máy này." },
            { k: "会う", r: "あう", pitch: "<span class='pitch-high'>あ</span>う", m: "Gặp gỡ", ej: "友人と駅で会う。", er: "ゆうじん と えき で あう。", ev: "Gặp bạn bè ở ga tàu." },
            { k: "合う", r: "あう", pitch: "あ<span class='pitch-high'>う</span>", m: "Hợp, phù hợp", ej: "この服はサイズが合う。", er: "この ふく は さいず が あう。", ev: "Bộ quần áo này vừa kích cỡ." },
            { k: "仰ぎ見る", r: "あおぎみる", pitch: "あ<span class='pitch-high'>おぎみ</span>る", m: "Ngước nhìn lên, tôn kính", ej: "夜空の星を仰ぎ見る。", er: "よぞら の ほし を あおぎみる。", ev: "Ngước nhìn ngôi sao trên bầu trời đêm." },
            { k: "仰ぐ", r: "あおぐ", pitch: "あ<span class='pitch-high'>お</span>ぐ", m: "Thỉnh cầu, ngước nhìn", ej: "指導を仰ぐ。", er: "しどう を あおぐ。", ev: "Thỉnh cầu sự chỉ đạo/hướng dẫn." },
            { k: "青ざめる", r: "あおざめる", pitch: "あ<span class='pitch-high'>おざめ</span>る", m: "Tái xanh mặt (vì sợ/bệnh)", ej: "驚きのあまり顔が青ざめる。", er: "おどろき の あまり かお が あおざめる。", ev: "Mặt tái xanh vì quá kinh ngạc." },
            { k: "あがる", r: "あがる", pitch: "あ<span class='pitch-high'>がる</span>", m: "Tăng lên, đi lên", ej: "物価が上がる。", er: "ぶっか が あがる。", ev: "Giá cả hàng hóa tăng lên." },
            { k: "諦める", r: "あきらめる", m: "Từ bỏ, bỏ cuộc", pitch: "あ<span class='pitch-high'>きらめ</span>る", ej: "夢を諦めない。", er: "ゆめ を あきらめない。", ev: "Không từ bỏ ước mơ." },
            { k: "飽きる", r: "あきる", pitch: "あ<span class='pitch-high'>き</span>る", m: "Chán, ngấy", ej: "同じ味に飽きる。", er: "おなじ あじ に あきる。", ev: "Chán ngấy cùng một hương vị." },
            { k: "あきれる", r: "あきれる", pitch: "あ<span class='pitch-high'>きれ</span>る", m: "Sốc, cạn lời", ej: "彼の態度にあきれる。", er: "かれ の たいど に あきれる。", ev: "Cạn lời trước thái độ của anh ta." },
            { k: "開く", r: "あく", pitch: "あ<span class='pitch-high'>く</span>", m: "Mở, trống", ej: "ドアが開く。", er: "どあ が あく。", ev: "Cánh cửa mở ra." },
            { k: "握手する", r: "あくしゅする", pitch: "<span class='pitch-high'>あ</span>くしゅする", m: "Bắt tay", ej: "ガッチリと握手する。", er: "がっちり と あくしゅ する。", ev: "Bắt tay thật chặt." },
            { k: "あくびする", r: "あくびする", pitch: "あ<span class='pitch-high'>くびする</span>", m: "Ngáp", ej: "退屈であくびする。", er: "たいくつ で あくび する。", ev: "Vì nhàm chán nên ngáp." },
            { k: "悪用する", r: "あくようする", pitch: "あ<span class='pitch-high'>くようする</span>", m: "Lợi dụng, dùng sai mục đích", ej: "立場を悪用する。", er: "たちば を あくよう する。", ev: "Lợi dụng vị trí/chức vụ." },
            { k: "開ける", r: "あける", pitch: "あ<span class='pitch-high'>ける</span>", m: "Mở (cửa, mắt...)", ej: "窓を開ける。", er: "まど を あける。", ev: "Mở cửa sổ." },
            { k: "上げる", r: "あげる", pitch: "あ<span class='pitch-high'>げる</span>", m: "Nâng lên, cho, tặng", ej: "手を上げる。", er: "て を あげる。", ev: "Giơ tay lên." },
            { k: "憧れる", r: "あこがれる", pitch: "あ<span class='pitch-high'>こがれ</span>る", m: "Ngưỡng mộ, mơ ước", ej: "日本での生活に憧れる。", er: "にほん で の せいかつ に あこがれる。", ev: "Mơ ước cuộc sống tại Nhật Bản." },
            { k: "味わう", r: "あじわう", pitch: "あ<span class='pitch-high'>じわ</span>う", m: "Thưởng thức, nếm trải", ej: "料理をじっくり味わう。", er: "りょうり を じっくり あじわう。", ev: "Thưởng thức kỹ món ăn." },
            { k: "預ける", r: "あずける", pitch: "あ<span class='pitch-high'>ずけ</span>る", m: "Gửi, giao ủy thác", ej: "荷物をロッカーに預ける。", er: "にもつ を ろっかー に あずける。", ev: "Gửi hành lý vào tủ đồ." },
            { k: "焦る", r: "あせる", pitch: "あ<span class='pitch-high'>せ</span>る", m: "Sốt ruột, nôn nóng", ej: "時間を気にして焦る。", er: "じかん を き に して あせる。", ev: "Sốt ruột vì để ý thời gian." },
            { k: "遊ぶ", r: "あそぶ", pitch: "あ<span class='pitch-high'>そぶ</span>", m: "Chơi, giải trí", ej: "公園で子供と遊ぶ。", er: "こうえん で こども と あそぶ。", ev: "Chơi với con ở công viên." },

            { k: "温める", r: "あたためる", pitch: "あ<span class='pitch-high'>たため</span>る", m: "Làm ấm, hâm nóng", ej: "スープを温める。", er: "すーぷ を あたためる。", ev: "Hâm nóng tô súp." },
            { k: "当たる", r: "あたる", pitch: "あ<span class='pitch-high'>たる</span>", m: "Trúng, đúng, va chạm", ej: "宝くじが当たる。", er: "たからくじ が あたる。", ev: "Trúng vé số." },
            { k: "扱う", r: "あつかう", pitch: "あ<span class='pitch-high'>つか</span>う", m: "Xử lý, thao tác, đối xử", ej: "丁寧に取り扱う。", er: "ていねい に とりあつかう。", ev: "Thao tác/xử lý cẩn thận." },
            { k: "悪化する", r: "あっかする", pitch: "<span class='pitch-high'>あ</span>っかする", m: "Trở nên tồi tệ, xấu đi", ej: "容態が悪化する。", er: "ようだい が あっか する。", ev: "Tình trạng sức khỏe xấu đi." },
            { k: "圧縮する", r: "あっしゅくする", pitch: "あ<span class='pitch-high'>っしゅくする</span>", m: "Nén (file, không khí)", ej: "ファイルを圧縮する。", er: "ふぁいる を あっしゅく する。", ev: "Nén tệp tin." },
            { k: "圧倒する", r: "あっとうする", pitch: "あ<span class='pitch-high'>っとうする</span>", m: "Áp đảo hoàn toàn", ej: "相手を圧倒する。", er: "あいて を あっとう する。", ev: "Áp đảo đối thủ." }
        ];

        let currentIndex = 0;
        const card = document.getElementById('card');

        function updateCard() {
            card.classList.remove('flipped');
            setTimeout(() => {
                const item = verbs[currentIndex];
                document.getElementById('kanji').innerText = item.k;
                document.getElementById('reading').innerText = item.r;
                document.getElementById('pitch').innerHTML = item.pitch;
                document.getElementById('meaning').innerText = item.m;
                document.getElementById('ex-jp').innerText = item.ej;
                document.getElementById('ex-read').innerText = item.er;
                document.getElementById('ex-vi').innerText = item.ev;
                document.getElementById('counter').innerText = `${currentIndex + 1} / ${verbs.length}`;
            }, 150);
        }

        function flipCard() {
            card.classList.toggle('flipped');
        }

        function nextCard(event) {
            event.stopPropagation();
            if (currentIndex < verbs.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard(event) {
            event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt không hỗ trợ đọc tự động.");
            }
        }

        function speakWord(event) {
            event.stopPropagation();
            const item = verbs[currentIndex];
            speakText(item.r);
        }

        function speakExample(event) {
            event.stopPropagation();
            const item = verbs[currentIndex];
            speakText(item.ej);
        }

        updateCard();
    </script>
</body>
</html>
